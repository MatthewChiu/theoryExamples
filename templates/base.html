<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site.site_title }}{% endblock %}</title>
<meta name="description" content="{{ site.site_description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/static/style.css' | relurl }}">
</head>
<body>
<header class="site-head">
  <a class="site-head__mark" href="{{ '/' | relurl }}">
    <span class="site-head__glyph">&#9834;</span>
    <span class="site-head__name">{{ site.site_title }}</span>
  </a>
  <nav class="site-head__nav">
    <a href="{{ '/tags/' | relurl }}">Tags</a>
    <a href="{{ '/composers/' | relurl }}">Composers</a>
  </nav>
</header>

<main class="page">
{% block content %}{% endblock %}
</main>

<footer class="site-foot">
  <p>A field catalog of harmonic and formal devices, kept by hand.</p>
</footer>
</body>
</html>
